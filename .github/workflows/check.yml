name: Check

# Every template: its shape (bin/check), then Fugue's own reading of it against Fugue's main
# branch. The checks are bin/check-all, the same script a contributor runs.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shape:
    name: Template shape
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bin/check

  fugue:
    name: Fugue reads every template
    runs-on: ubuntu-latest
    container: archlinux:latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Install git for the checkouts
        run: pacman -Syu --noconfirm --needed git python

      - uses: actions/checkout@v4
        with:
          path: templates

      - name: Check out Fugue's main branch
        run: git clone --depth 1 https://github.com/bmaltais/fugue.git fugue

      - name: Install Fugue's build dependencies
        run: |
          source fugue/packaging/PKGBUILD
          deps=("${depends[@]}" "${makedepends[@]}")
          wanted=()
          for dep in "${deps[@]%%[<>=]*}"; do [[ $dep == cuda ]] || wanted+=("$dep"); done
          pacman -S --noconfirm --needed base-devel cmake "${wanted[@]}"

      - name: Build fugue
        run: fugue/bin/build fugue

      # bin/check-all is what a contributor runs: bin/check, `fugue template list` with no warnings, every workflow
      # validates (a node of a pack the template carries is allowed: CI cannot install and trust packs, see bin/validate-all),
      # and every app reads (bin/check-apps).
      - name: Check every template
        run: templates/bin/check-all "$GITHUB_WORKSPACE/fugue/build/fugue"
