name: Check

# Every template: its shape (bin/check), then Fugue's own reading of it against Fugue's main
# branch: `fugue template list` with no warnings, every workflow validates, and every app (a workflow with an
# `app` block) reads (bin/check-apps).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shape:
    name: Template shape
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bin/check

  fugue:
    name: Fugue reads every template
    runs-on: ubuntu-latest
    container: archlinux:latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Install git for the checkouts
        run: pacman -Syu --noconfirm --needed git python

      - uses: actions/checkout@v4
        with:
          path: templates

      - name: Check out Fugue's main branch
        run: git clone --depth 1 https://github.com/bmaltais/fugue.git fugue

      - name: Install Fugue's build dependencies
        run: |
          source fugue/packaging/PKGBUILD
          deps=("${depends[@]}" "${makedepends[@]}")
          wanted=()
          for dep in "${deps[@]%%[<>=]*}"; do [[ $dep == cuda ]] || wanted+=("$dep"); done
          pacman -S --noconfirm --needed base-devel cmake "${wanted[@]}"

      - name: Build fugue
        run: fugue/bin/build fugue

      - name: Fugue lists every template, with no warnings
        run: |
          FUGUE_TEMPLATES=$PWD/templates fugue/build/fugue template list --json > list.json
          python3 -c "
          import json, sys
          reply = json.load(open('list.json'))
          for w in reply.get('warnings', []): print(w['message'], file=sys.stderr)
          listed = len(reply['data']['templates'])
          print(listed, 'templates listed')
          sys.exit(1 if reply.get('warnings') or listed == 0 else 0)"

      # A node of a pack the template carries is allowed: CI cannot install and trust packs (bin/validate-all).
      - name: Every workflow validates
        run: templates/bin/validate-all "$GITHUB_WORKSPACE/fugue/build/fugue"

      - name: Every app reads
        run: templates/bin/check-apps "$GITHUB_WORKSPACE/fugue/build/fugue"
